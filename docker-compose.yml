version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongo_pikbil
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7.2
    container_name: redis_pikbil
    command: ["redis-server", "--requirepass", "abc"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
